plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}

// Load config variables from .env via react-native-config
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bwellembeddable"

    defaultConfig {
        applicationId "com.bwellembeddable"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Exclude the old standalone com.facebook.hermes:hermes-android that gets
// pulled in transitively by react-native-webview -> react-native:+.
// That artifact's HermesExecutor calls SoLoader.loadLibrary("hermes_executor")
// which no longer exists in RN 0.71+.  Our explicit com.facebook.react:hermes-android
// dep provides the correct HermesExecutor that loads libhermes.so.
configurations.all {
    exclude group: 'com.facebook.hermes', module: 'hermes-android'
}

dependencies {
    implementation(project(':react-native-config'))
    implementation(project(':react-native-webview'))
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

react {
}
